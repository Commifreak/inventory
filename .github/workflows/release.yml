name: Image

# main -> ghcr.io/<owner>/inventory:edge   (agent version <VERSION>-edge.<timestamp>)
# tag vX.Y.Z -> :X.Y.Z, :X.Y, :latest      (agent version X.Y.Z)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)-edge.$(date -u +%Y%m%d%H%M)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/inventory
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: check signing key
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: test -n "$KEY" || (echo "::error::secret RELEASE_SIGNING_KEY is missing" && exit 1)
      - uses: docker/build-push-action@v6
        env:
          # Passed via secret-envs: the "secrets" input splits multi-line values.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          secret-envs: |
            release_signing_key=RELEASE_SIGNING_KEY
          cache-from: type=gha
          cache-to: type=gha,mode=max
