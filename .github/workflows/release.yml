name: Image

# main -> ghcr.io/<owner>/inventory:edge   (agent version <last tag, patch+1>-edge.<timestamp>,
#         e.g. 0.2.1-edge.202611181200 after v0.2.0; see scripts/version.sh)
# tag vX.Y.Z -> :X.Y.Z, :X.Y, :latest      (agent version X.Y.Z)
# tag vX.Y.Z also builds the Home Assistant add-on image
#   ghcr.io/<owner>/inventory-ha-agent:X.Y.Z and sets the version in the add-on
#   repository (secret ADDON_REPO_TOKEN: contents write on inventory-ha-addon).
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags for scripts/version.sh
      - name: version
        id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(REQUIRE_TAG=1 scripts/version.sh "edge.$(date -u +%Y%m%d%H%M)")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: changelog
        # "What's new" in the web UI: merged pull requests per release, bundled in the image.
        run: go run ./cmd/inventory-release changelog -version "${{ steps.v.outputs.version }}" -out internal/server/changelog.json
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/inventory
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: check signing key
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: test -n "$KEY" || (echo "::error::secret RELEASE_SIGNING_KEY is missing" && exit 1)
      - uses: docker/build-push-action@v6
        env:
          # Passed via secret-envs: the "secrets" input splits multi-line values.
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          secret-envs: |
            release_signing_key=RELEASE_SIGNING_KEY
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ha-addon:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # history and tags for scripts/addon-changelog.sh
      - name: version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inventory-ha-agent" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ha-addon/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ steps.v.outputs.version }}
            ${{ steps.img.outputs.name }}:latest
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha,scope=ha-addon
          cache-to: type=gha,mode=max,scope=ha-addon
      - name: check add-on repository token
        env:
          TOKEN: ${{ secrets.ADDON_REPO_TOKEN }}
        run: test -n "$TOKEN" || (echo "::error::secret ADDON_REPO_TOKEN is missing" && exit 1)
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/inventory-ha-addon
          token: ${{ secrets.ADDON_REPO_TOKEN }}
          path: addon-repo
      - name: set add-on version
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          # Changes of this release that concern the add-on (shown by Home
          # Assistant in the update dialog).
          entry=$(scripts/addon-changelog.sh "${VERSION}" "${GITHUB_REPOSITORY}")
          cd addon-repo
          sed -i -E "s/^version: .*/version: \"${VERSION}\"/" inventory-agent/config.yaml
          if ! grep -q "^## ${VERSION}$" inventory-agent/CHANGELOG.md; then
            { echo "# Changelog"; echo; echo "${entry}"; echo; \
              tail -n +3 inventory-agent/CHANGELOG.md; } > CHANGELOG.new && mv CHANGELOG.new inventory-agent/CHANGELOG.md
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "add-on already at ${VERSION}"; exit 0; fi
          git commit -m "Inventory Agent ${VERSION}"
          git push
