name: Vulnerability check

# govulncheck reports known vulnerabilities in the Go standard library and
# modules that the code actually calls. Runs on every change and weekly, so
# new advisories for released code fail a run (GitHub mails the maintainer).

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Same as GO_VERSION in the Dockerfiles: the images are built with
          # the latest patch release, so check against that one.
          go-version: '1.26'
          check-latest: true
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: govulncheck (${{ matrix.goos }})
        env:
          GOOS: ${{ matrix.goos }} # packages are loaded for this OS
        run: govulncheck ./...
