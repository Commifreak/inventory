name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: |
          go vet ./...
          for p in windows/amd64 windows/arm64 linux/arm64 darwin/arm64; do
            GOOS=${p%/*} GOARCH=${p#*/} go vet ./internal/agent/ ./cmd/inventory-agent/
          done
      - name: test
        run: go test -race ./...
      - name: build agents (unsigned)
        run: SMARTCTL_SKIP=1 ./scripts/build-agents.sh

  windows:
    # Runs the real collectors on a Windows VM as a smoke test.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go test ./internal/agent/ ./internal/tag/ ./internal/release/
      - name: collect
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          go build -o inventory-agent.exe ./cmd/inventory-agent
          $p = Start-Process -FilePath .\inventory-agent.exe -ArgumentList 'collect' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput collect.json -RedirectStandardError collect.err
          "exit code: $($p.ExitCode)"
          Get-Content collect.err
          $raw = Get-Content collect.json -Raw
          "output: $($raw.Length) characters"
          $r = $raw | ConvertFrom-Json
          foreach ($s in $r.sections.PSObject.Properties) {
            "{0,-10} {1,6} ms  error: {2}  warnings: {3}" -f $s.Name, $s.Value.duration_ms, $s.Value.error, ($s.Value.warnings -join '; ')
          }
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: proxy
        shell: pwsh
        run: |
          function ProxyFor($u) {
            $p = Start-Process -FilePath .\inventory-agent.exe -ArgumentList 'proxy', $u -NoNewWindow -Wait -PassThru `
              -RedirectStandardOutput proxy.out -RedirectStandardError proxy.err
            Get-Content proxy.err
            (Get-Content proxy.out -Raw)
          }
          # Machine-wide WinHTTP proxy (netsh) must be picked up, bypass list honoured.
          netsh winhttp set proxy proxy-server="ci-proxy.invalid:3128" bypass-list="<local>;*.example.org"
          try {
            $a = ProxyFor 'https://inventory.example.com/'
            $b = ProxyFor 'https://intranet.example.org/'
            "proxied:  $a"; "bypassed: $b"
            if ($a -notmatch 'ci-proxy.invalid:3128' -or $a -notmatch 'WinHTTP') { throw "WinHTTP proxy not used" }
            if ($b -notmatch 'direct') { throw "bypass list ignored" }
          } finally {
            netsh winhttp reset proxy
          }
          "after reset: $(ProxyFor 'https://inventory.example.com/')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-collect
          path: |
            collect.json
            collect.err
