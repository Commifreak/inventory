{{define "content"}}
<div class="card narrowcard">
  <h1>Change password</h1>
  {{if .User.MustChangePassword}}<p class="flash warn">Please set a new password before you continue.</p>{{end}}
  <form method="post" action="/account/password">
    {{template "csrf" .CSRF}}
    <label>Current password <input type="password" name="current" autocomplete="current-password" required></label>
    <label>New password <small class="muted">(at least 12 characters)</small> <input type="password" name="new" autocomplete="new-password" minlength="12" maxlength="72" required></label>
    <label>Repeat new password <input type="password" name="confirm" autocomplete="new-password" minlength="12" maxlength="72" required></label>
    <button class="primary">Save</button>
  </form>
</div>
{{end}}
