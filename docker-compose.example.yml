# Example deployment behind Traefik (TLS is terminated by Traefik).
# Copy to docker-compose.yml and adjust the host name.
services:
  inventory:
    image: ghcr.io/commifreak/inventory:latest
    container_name: inventory
    restart: unless-stopped
    environment:
      # Public URL of the server; it is written into the agent installers.
      BASE_URL: https://inventory.example.com
      # Time zone for the UI and alert mails.
      TZ: Europe/Berlin
      # Optional: initial password for "admin" (otherwise printed to the log once).
      # INITIAL_ADMIN_PASSWORD: change-me-please
      # Optional single sign-on (Authentik, Authelia, Keycloak, ...):
      # OIDC_ISSUER: https://auth.example.com/application/o/inventory/
      # OIDC_CLIENT_ID: inventory
      # OIDC_CLIENT_SECRET: ...
      # OIDC_ADMIN_GROUP: inventory-admins   # superadmins; areas get their own groups in the UI
      # LOCAL_LOGIN: "false"     # disable password login once SSO works
    volumes:
      # Contains the database AND the encryption key - back it up.
      - inventory-data:/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.inventory.rule=Host(`inventory.example.com`)
      - traefik.http.routers.inventory.entrypoints=websecure
      - traefik.http.routers.inventory.tls.certresolver=letsencrypt
      - traefik.http.services.inventory.loadbalancer.server.port=8080
      # If you want to protect the web UI with a forward-auth middleware
      # (Authelia/Authentik outpost) in addition, the agent API must stay
      # reachable without it. Use two routers:
      # - traefik.http.routers.inventory.middlewares=authelia@docker
      # - traefik.http.routers.inventory-agents.rule=Host(`inventory.example.com`) && PathPrefix(`/api/agent/`)
      # - traefik.http.routers.inventory-agents.entrypoints=websecure
      # - traefik.http.routers.inventory-agents.tls.certresolver=letsencrypt
      # - traefik.http.routers.inventory-agents.service=inventory

volumes:
  inventory-data:

networks:
  traefik:
    external: true
